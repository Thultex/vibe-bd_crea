[symbols]
# Aktuell vorhanden: default = 10 Symbole, k = 10 Symbole.
# Layoutbedarf: Memory+Domino = ab 2 / gesamtes Auswahlfenster, Gruselino = 8,
# Minimalspiel A4 = die ersten bis zu 10 Symbole auf einem Spielplan.
# Bingo = 16 Felder auf vier vollständigen Karten; bei weniger Symbolen zyklisch.
# Dobble = bis zu 31 verschiedene Symbole auf 31 Karten mit je 6 Symbolen.
# Erstes Symbol: Erste verwendete Hauptdatei; 1 entspricht 01.png.
start_symbol = 1
# Anzahl verwendeter Symbole: -1 verwendet automatisch alle ab start_symbol vorhandenen Symbole.
symbol_count = -1
