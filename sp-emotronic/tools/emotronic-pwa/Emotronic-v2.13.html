   beim Teilen nichts an einen Server übertragen. Clipboard-Fehler bleiben
   folgenlos; die normale Tastenfunktion läuft immer weiter. */
function encodeSharePayload(payload){
 try{return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
 catch{return null}
}
function decodeSharePayload(value){
 try{const padded=value.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((value.length+3)%4);return JSON.parse(decodeURIComponent(escape(atob(padded))))}
 catch{return null}
}
function shareReference(payload,fragmentOverride=null){
 const encoded=encodeSharePayload(payload);
 if(!encoded)return null;
 const fragmentType=fragmentOverride==='slow'?'slow':payload?.type==='score'?'score':payload?.type==='replay'?'replay':'share';
 const fragment=`#${fragmentType}=${encoded}`;
 // content:// und file:// sind geräteinterne Adressen und in normalen Browsern
 // nicht als teilbare Links nutzbar. Nur HTTP(S) ergibt einen echten Link.
 if(location.protocol==='http:'||location.protocol==='https:'){
  const url=new URL(location.href);
  url.hash=fragment.slice(1);
  return {text:url.toString(),isLink:true};
 }
 return {text:fragment,isLink:false};
}

}
function legacyCopyText(text){
 const field=document.createElement('textarea');
 field.value=text;
 field.setAttribute('aria-hidden','true');
 field.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
 document.body.appendChild(field);
 field.focus({preventScroll:true});
 field.select();
 field.setSelectionRange(0,field.value.length);
 let copied=false;
 try{copied=document.execCommand('copy')}catch{copied=false}
 field.remove();
 return copied
}
async function copyTextRobust(text){
 if(navigator.clipboard&&window.isSecureContext){
  try{await navigator.clipboard.writeText(text);return true}catch{}
 }
 return legacyCopyText(text)
}
async function copyModeLink(mode){
 let text=`#${mode}`;if(location.protocol==='http:'||location.protocol==='https:'){const url=new URL(location.href);url.searchParams.delete('mode');url.hash=mode;text=url.toString()}return copyTextRobust(text)
}
async function copySharePayload(payload,label,fragmentOverride=null){
 const reference=shareReference(payload,fragmentOverride);
 if(!reference){flashShareStatus('Teilen nicht möglich');return}
 const copied=await copyTextRobust(reference.text);
 if(!copied){flashShareStatus('Kopieren nicht möglich');return}
 flashShareStatus(reference.isLink?`${label} kopiert`:`${label.replace('-Link','')}-Code kopiert`)
}
function validSharedGameSequence(sequence){

  return gameKeys.includes(action.key)&&Number(action.level)>=1&&Number(action.level)<=3
 })
}

}

 stage.textContent='AUS?';stage.classList.remove('pulse','shake');void stage.offsetWidth;stage.classList.add('pulse');
 el('off').classList.add('pulse');
 state.powerArmTimer=setTimeout(()=>{
  state.powerArmed=false;screen.classList.remove('power-confirm','special-status');el('off').classList.remove('pulse');stage.classList.remove('pulse');render();
 },APP_CONFIG.confirmations.powerOffMs)
}
el('less').onclick=()=>setIntensity(state.intensity-1);el('more').onclick=()=>setIntensity(state.intensity+1);const offBtn=el('off');offBtn.onclick=()=>{if(cancelIncomingShare()){state.longPressTriggered=false;return}if(state.replaying){cancelReplayToReady();state.longPressTriggered=false;return}if(!state.longPressTriggered)armPower();state.longPressTriggered=false};offBtn.onpointerdown=()=>{state.longPressTriggered=false;if(state.incomingShare)return;state.longPressTimer=setTimeout(()=>replayHistory(),700)};offBtn.onpointerup=offBtn.onpointercancel=()=>clearTimeout(state.longPressTimer);
function toggleCombo(){
 if(state.game.active)return;
 if(!state.powered)return;
 state.slowReplay=false;
 if(state.comboMode){exitCombo();return}
 if(!state.selected||state.selected==='neutral'){
  if(state.selected==='neutral'){
   const latest=state.history.at(-1);
   if(latest&&!latest.isCombo&&latest.key==='neutral')state.history.pop();
   state.selected=null;state.displayKey=null;state.intensity=0;state.last=null;
  }
  state.comboMode=true;state.comboFirst=COMBO_OVERVIEW_KEY;render();return
 }
 // Die aktuell gewählte Grundemotion ist sofort der Startpunkt.
 // Bei einer bereits bestehenden Kombination bleibt die Taste ohne Funktion.
 if(typeof state.selected==='object')return;
 state.comboMode=true;state.comboFirst=state.selected;render()
}
el('combo').onclick=toggleCombo;
const repeatBtn=el('repeat');
function cancelReplayToLatest(){
 // R während der normalen Verlauf-Wiedergabe bricht nur ab.
 // Der zuletzt gewählte normale Zustand und der erneute Replay-Hinweis bleiben sichtbar.
 stopReplay(false,true);
 showReplayCount(state.history.length);
 clearTimeout(state.omDelayTimer);
 state.omDelayTimer=null;
 document.querySelectorAll('.emotion-key').forEach(button=>button.classList.remove('replay-dim'));
 render();fadeReplayLabelsIn();
}
function cancelReplayToReady(){
 // Aus während der Verlauf-Wiedergabe beendet und löscht den Verlauf,
 // ohne das Gerät auszuschalten. Danach steht die App im echten Bereitschaftszustand.
 stopReplay(false);
 clearTimeout(state.omDelayTimer);
 state.omDelayTimer=null;
 state.history=[];
 state.slowReplay=false;
 state.selected=null;
 state.displayKey=null;
 state.intensity=0;
 state.last=null;
 state.comboMode=false;
 state.comboFirst=null;
 state.bgCode=null;
 state.source=APP_CONFIG.normalMode.defaultSource;
 updateGhostEmoji(null);
 document.querySelectorAll('.emotion-key').forEach(button=>button.classList.remove('selected','partner','replay-dim'));
 render();fadeReplayLabelsIn();
}
function repeatAllHistory(){
 if(!state.powered){enterMemoryGameSelection();return}
 if(state.game.active){if(state.game.phase==='select'){if(state.lastGameOver)showSharedGameScore(state.lastGameOver);return}if(state.game.awaitingShutdown){startMemoryGame(state.game.mode||'normal');return}requestGameRestart();return}
 if(state.replaying){cancelReplayToLatest();return}
 clearTimeout(state.repeatClickTimer);
 replayHistory();
}
repeatBtn.onclick=repeatAllHistory;
repeatBtn.ondblclick=event=>{event.preventDefault();repeatAllHistory()};
function shareReplayFromPhone(){
 recordHistory('sync-current');
 if(state.history.length)copySharePayload({type:'replay',items:state.history.slice(-40)},'Replay-Link');
 else flashShareStatus('Replay ist leer')
}
function shareSlowReplayFromWifi(){
 recordHistory('sync-current');
 if(state.history.length)copySharePayload({type:'replay',items:state.history.slice(-40)},'Slow-Replay-Link','slow');
 else flashShareStatus('Replay ist leer')
}
el('sendBtn').onclick=event=>{
 const doubled=isDoubleTap('phone');
 if(doubled){event.preventDefault();shareReplayFromPhone();return}
 if(!state.powered){copyModeLink('off');return}
 if(state.game.active&&state.game.phase==='select'){copyModeLink('simon');return}
 if(!state.selected&&!state.powerAnimating&&!state.powerArmed){copyModeLink('on');return}
 state.source='self';render();animateSource('self');flashShareStatus('Replay teilen: Zweimal ☎ klicken.',3000)
};
el('receiveBtn').onclick=event=>{
 const doubled=isDoubleTap('wifi');
 if(doubled){event.preventDefault();shareSlowReplayFromWifi();return}
 if(!state.powered)return;
 if(state.game.active&&state.game.phase==='select')return;
 state.source='other';render();animateSource('other');flashShareStatus('Slow-Replay teilen: Zweimal 📶 klicken.',3000)
};

// Tastatursteuerung: Ziffern entsprechen der sichtbaren 3×3-Tastenanordnung.
const keyboardEmotionMap={
 'Digit7':'curiosity','Numpad7':'curiosity',
 'Digit8':'joy','Numpad8':'joy',
 'Digit9':'affection','Numpad9':'affection',
 'Digit4':'anger','Numpad4':'anger',
 'Digit5':'neutral','Numpad5':'neutral',
 'Digit6':'fear','Numpad6':'fear',
 'Digit1':'disgust','Numpad1':'disgust',
 'Digit2':'sadness','Numpad2':'sadness',
 'Digit3':'surprise','Numpad3':'surprise'
};
const keyGrid=[
 ['curiosity','joy','affection'],
 ['anger','neutral','fear'],
 ['disgust','sadness','surprise']
];
function currentGridKey(){
 if(state.comboMode&&state.comboFirst)return state.comboFirst;
 if(typeof state.selected==='object')return state.displayKey;
 return state.selected;
}
function moveSelection(dx,dy){
 if(!state.powered)return;
 const current=currentGridKey();
 let row=1,col=1;
 if(current){
  for(let r=0;r<keyGrid.length;r++){
   const c=keyGrid[r].indexOf(current);
   if(c!==-1){row=r;col=c;break}
  }
 }
 const nextRow=Math.max(0,Math.min(2,row+dy));
 const nextCol=Math.max(0,Math.min(2,col+dx));
 if(nextRow===row&&nextCol===col)return;
 const nextKey=keyGrid[nextRow][nextCol];
 // In der zweiten Kombinationsstufe reagieren Pfeile nur auf zulässige Nachbarn.
 if(state.comboMode&&state.comboFirst&&!allowedPartners(state.comboFirst).includes(nextKey))return;
 pressEmotion(nextKey);
}
window.addEventListener('keydown',event=>{
 // Wiederholtes Gedrückthalten soll keine Emotion oder Funktion mehrfach auslösen.
 const repeatable=event.code==='NumpadAdd'||event.code==='NumpadSubtract'||event.key==='+'||event.key==='-';
 if(event.repeat&&!repeatable)return;

 // Nach GAME OVER reagieren ausschließlich R und die Aus-Taste.
 if(state.game.active&&state.game.awaitingShutdown){
  const restart=event.code==='KeyR'||event.code==='Comma'||event.key===',';
  const powerOff=event.code==='Escape'||event.code==='Digit0'||event.code==='Numpad0';
  event.preventDefault();
  if(restart)startMemoryGame(state.game.mode||'normal')
  else if(powerOff)shutdownGame();
  return;
 }

 // Ein/Aus: Escape sowie 0 auf Haupttastatur und Numpad.
 if(event.code==='Escape'||event.code==='Digit0'||event.code==='Numpad0'){
  event.preventDefault();armPower();return
 }
 // Wiederholen: R oder Komma.
 if(event.code==='KeyR'||event.code==='Comma'||event.key===','){
  event.preventDefault();el('repeat').click();return
 }
 // Kombinieren: E oder Multiplikationstaste.
 if(event.code==='KeyE'||event.code==='NumpadMultiply'||event.key==='*'){
  event.preventDefault();toggleCombo();return
 }

 const emotionKey=keyboardEmotionMap[event.code];
 if(emotionKey){
  event.preventDefault();
  // Während der zweiten Kombinationsauswahl werden unzulässige Nummern ignoriert.
  if(state.comboMode&&state.comboFirst&&emotionKey!==state.comboFirst&&!allowedPartners(state.comboFirst).includes(emotionKey))return;
  pressEmotion(emotionKey);return
 }
 if(event.code==='ArrowLeft'){event.preventDefault();moveSelection(-1,0);return}
 if(event.code==='ArrowRight'){event.preventDefault();moveSelection(1,0);return}
 if(event.code==='ArrowUp'){event.preventDefault();moveSelection(0,-1);return}
 if(event.code==='ArrowDown'){event.preventDefault();moveSelection(0,1);return}
 if(event.code==='NumpadAdd'||event.key==='+'){event.preventDefault();setIntensity(state.intensity+1);return}
 if(event.code==='NumpadSubtract'||event.key==='-'){event.preventDefault();setIntensity(state.intensity-1);return}
});

function fitAppToVisibleHeight(){
 const app=document.querySelector('.app');
 if(!app)return;
 // Erst unskaliert messen, danach die komplette Oberfläche proportional verkleinern.
 app.style.setProperty('--app-fit-scale','1');
 const viewport=window.visualViewport;
 const availableWidth=Math.max(1,(viewport?.width||document.documentElement.clientWidth)-4);
 const availableHeight=Math.max(1,(viewport?.height||document.documentElement.clientHeight)-4);
 const rect=app.getBoundingClientRect();
 const scale=Math.min(1,availableWidth/rect.width,availableHeight/rect.height);
 app.style.setProperty('--app-fit-scale',String(Math.max(.5,scale)));
}
let fitFrame=0;
function scheduleAppFit(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(()=>requestAnimationFrame(fitAppToVisibleHeight))}
window.addEventListener('resize',scheduleAppFit,{passive:true});
window.addEventListener('orientationchange',scheduleAppFit,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleAppFit,{passive:true});

build();
applySharedPayload();
scheduleAppFit();
// Zweite Absicherung nach dem ersten Layout/PWA-Restore.
requestAnimationFrame(()=>requestAnimationFrame(()=>{
 if(state.powered&&!state.selected&&!state.game.active&&!state.powerAnimating&&!state.powerArmed){
  state.intensity=0;
  document.querySelectorAll('.segment').forEach(s=>s.classList.remove('active'));
  const n=el('needle');n.style.transition='none';n.style.setProperty('--needle-pos','0');n.style.setProperty('--needle-color','#9aa09a');
  void n.offsetWidth;n.style.transition='';
 }
}));
</script>
